<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selfie to QR</title>

  <!-- QR Code library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f6fa; padding: 20px; }
    .container { background: #fff; padding: 30px 40px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); max-width: 380px; width: 100%; text-align: center; }
    h2 { margin-bottom: 20px; color: #2f3640; font-weight: 600; font-size: 1.6rem; }
    video, canvas, img { width: 100%; height: auto; border-radius: 10px; border: 1px solid #dcdde1; margin-bottom: 15px; }
    #qr canvas { margin-top: 15px; }
    button { padding: 12px 20px; margin: 10px 5px 0 5px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; transition: 0.3s; }
    #captureBtn { background-color: #4cd137; color: #fff; }
    #captureBtn:hover { background-color: #44bd32; }
    #uploadBtn { background-color: #487eb0; color: #fff; }
    #uploadBtn:hover { background-color: #40739e; }
    #uploadBtn:disabled { background-color: #dcdde1; cursor: not-allowed; }
    #status { margin-top: 10px; font-size: 0.95rem; color: #718093; }
    @media (max-width: 420px) { .container { padding: 20px; } }
  </style>
</head>

<body>
  <div class="container">
    <h2>Selfie → QR Generator</h2>

    <!-- Live camera -->
    <video id="video" autoplay playsinline></video>

    <!-- Hidden canvas -->
    <canvas id="canvas" width="320" height="240" style="display:none"></canvas>

    <button id="captureBtn">📸 Capture</button>
    <button id="uploadBtn" disabled>Upload & Generate QR</button>

    <p id="status">Initializing camera...</p>

    <div id="previewContainer"></div>
    <div id="qr"></div>
  </div>

  <script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const statusEl = document.getElementById("status");
let blob;

// Replace this with your Imgur Client ID
const IMGUR_CLIENT_ID = "YOUR_REAL_IMGUR_CLIENT_ID";

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
    video.srcObject = stream;
    statusEl.textContent = "Camera is ready.";
  } catch (err) {
    statusEl.textContent = "Camera access denied!";
  }
}

window.onload = startCamera;

document.getElementById("captureBtn").onclick = () => {
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  canvas.toBlob(b => {
    blob = b;
    document.getElementById("uploadBtn").disabled = false;

    const img = document.createElement("img");
    img.src = URL.createObjectURL(b);
    document.getElementById("previewContainer").innerHTML = "";
    document.getElementById("previewContainer").appendChild(img);
  }, "image/jpeg");
};

document.getElementById("uploadBtn").onclick = async () => {
  if (!blob) return alert("Please capture first.");

  const formData = new FormData();
  formData.append("image", blob);

  statusEl.textContent = "Uploading to Imgur...";

  try {
    const res = await fetch("https://api.imgur.com/3/image", {
      method: "POST",
      headers: { Authorization: `Client-ID ${IMGUR_CLIENT_ID}` },
      body: formData
    });

    const data = await res.json();
    if (data.success) {
      const imageUrl = data.data.link; // public URL
      statusEl.textContent = "QR generated! Scan to view image.";

      // Generate QR
      QRCode.toCanvas(imageUrl, { width: 200 }, (err, qrCanvas) => {
        if (err) return console.error(err);
        document.getElementById("qr").innerHTML = "";
        document.getElementById("qr").appendChild(qrCanvas);
      });
    } else {
      statusEl.textContent = "Upload failed!";
      console.error(data);
    }
  } catch (err) {
    statusEl.textContent = "Upload failed!";
    console.error(err);
  }
};
</script>

</body>
</html>
